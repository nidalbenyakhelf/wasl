<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181d25">
    <title>وصْل | بوابة الجمعيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="associations.css" />
</head>
<body>

<header>
    <div class="btn-group-header"><button data-toggle="profileList"><i class="fa fa-bars"></i></button></div>
    <a href="../index.html" class="mainLogo"><img src="../assets/logo.png" alt="وصْل"></a>
    <div class="popup profileList">
        <div class="header"><img src="../assets/logo.png" alt="وصْل"><button class="btnClose" data-close><i class="fa-solid fa-xmark"></i></button></div>
        <div class="main">
            <a href="../index.html"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="../needy/needy.html"><i class="fa-solid fa-hand-holding-heart"></i> المحتاجين</a>
            <a href="../volunteers/volunteers.html"><i class="fa-solid fa-users"></i> المتطوعين</a>
            <a href="associations.html"><i class="fa-solid fa-building-ngo"></i> الجمعيات</a>
            <a href="../admin/admin.html"><i class="fa-solid fa-shield-halved"></i> الإدارة</a>
        </div>
    </div>
</header>

<main style="min-height: auto; padding-top: 120px; padding-bottom: 4rem; background: linear-gradient(to bottom, rgb(24, 29, 37), rgb(15, 19, 25));">
    <div class="container">
        <div class="section-header">
            <h2>شبكة تبادل الموارد</h2>
            <p>نظام ذكي يربط فائض الموارد بالاحتياجات العاجلة بين الجمعيات الجزائرية</p>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:3rem;" class="exchange-grid">
            <div class="glass-form" style="border-color:rgba(34,197,94,0.3);">
                <h3 style="color:#22c55e;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem;"><i class="fa-solid fa-boxes-stacked"></i> موارد متاحة (فائض)</h3>
                <div id="surplusList"></div>
            </div>
            <div class="glass-form" style="border-color:rgba(239,68,68,0.3);">
                <h3 style="color:#ef4444;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem;"><i class="fa-solid fa-hand-holding-medical"></i> احتياجات عاجلة</h3>
                <div id="needsList"></div>
            </div>
        </div>

        <div class="glass-form" style="border-color:rgba(0,245,160,0.3);">
            <h3 style="color:#00f5a0;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem;"><i class="fa-solid fa-wand-magic-sparkles"></i> اقتراحات المطابقة الذكية</h3>
            <div id="matchesList"></div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-logo"><img src="../assets/logo.png" alt="وصْل"></div>
        <p>&copy; 2026 منصة وصْل - الجزائر. جميع الحقوق محفوظة.</p>
    </div>
</footer>

<script src="associations.js"></script>
</body>
</html>
